plugins {
    id 'com.android.application'
}

// Production releases must use a long-lived owner-managed signing key.
// No signing secrets are stored in the source tree or in build artifacts.
def releaseStorePath = System.getenv('TV_RELEASE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('TV_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('TV_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('TV_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword,
                         releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
        && !hasReleaseSigning) {
    throw new GradleException('A production release requires the TV_RELEASE_* signing secrets.')
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // Independent proof-of-concept: the preview package exposes ONLY an Ambient launcher activity.
    // Its MainActivity is disabled, so it cannot take the system HOME role accidentally.
    def ambientPreview = providers.gradleProperty('ambientPreview').map { it.toBoolean() }.getOrElse(false)
    // The experimental Home UI runs as an ordinary TV app; never eligible as HOME.
    def homePreview = providers.gradleProperty('homePreview').map { it.toBoolean() }.getOrElse(false)
    if (homePreview && ambientPreview) {
        throw new GradleException("Use only one preview mode (homePreview OR ambientPreview).")
    }

    // Separate manual opt-in DreamService feature; impossible to enable on the
    // default launcher build or on earlier manual-only preview packages.
    def ambientDreamPreview = ambientPreview &&
            providers.gradleProperty('ambientDreamPreview').map { it.toBoolean() }.getOrElse(false)

    // Default launcher remains network-free. Only explicit Ambient previews get INTERNET.
    sourceSets {
        main {
            manifest.srcFile(homePreview ? 'src/homePreview/AndroidManifest.xml'
                    : ambientPreview ? 'src/ambientPreview/AndroidManifest.xml'
                    : 'src/main/AndroidManifest.xml')
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            ownerRelease {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        manifestPlaceholders = [
                mainActivityEnabled: (!ambientPreview).toString(),
                ambientPreviewEnabled: ambientPreview.toString(),
                ambientDreamEnabled: ambientDreamPreview.toString()
        ]
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('launcherVersionCode').map { Integer.parseInt(it) }.getOrElse(7)
        versionName providers.gradleProperty('launcherVersionName').getOrElse('2.6')
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No debug-key fallback: real release builds require owner-managed signing.
            if (hasReleaseSigning) signingConfig signingConfigs.ownerRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
