plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // Independent proof-of-concept: the preview package exposes ONLY an Ambient launcher activity.
    // Its MainActivity is disabled, so it cannot take the system HOME role accidentally.
    def ambientPreview = providers.gradleProperty('ambientPreview').map { it.toBoolean() }.getOrElse(false)
    // The experimental Home UI runs as an ordinary TV app; never eligible as HOME.
    def homePreview = providers.gradleProperty('homePreview').map { it.toBoolean() }.getOrElse(false)
    // Opt-in default-HOME candidate built separately from the verified v7 preview.
    def homeCandidate = providers.gradleProperty('homeCandidate').map { it.toBoolean() }.getOrElse(false)
    if ((homePreview ? 1 : 0) + (ambientPreview ? 1 : 0) + (homeCandidate ? 1 : 0) > 1) {
        throw new GradleException("Choose one of homePreview, ambientPreview, or homeCandidate.")
    }

    // Separate manual opt-in DreamService feature; impossible to enable on the
    // default launcher build or on earlier manual-only preview packages.
    def ambientDreamPreview = ambientPreview &&
            providers.gradleProperty('ambientDreamPreview').map { it.toBoolean() }.getOrElse(false)

    // Default launcher remains network-free. Only explicit Ambient previews get INTERNET.
    sourceSets {
        main {
            manifest.srcFile(homeCandidate ? 'src/homeCandidate/AndroidManifest.xml'
                    : homePreview ? 'src/homePreview/AndroidManifest.xml'
                    : ambientPreview ? 'src/ambientPreview/AndroidManifest.xml'
                    : 'src/main/AndroidManifest.xml')
        }
    }

    defaultConfig {
        manifestPlaceholders = [
                mainActivityEnabled: (!ambientPreview && !homePreview && !homeCandidate).toString(),
                ambientPreviewEnabled: ambientPreview.toString(),
                ambientDreamEnabled: ambientDreamPreview.toString()
        ]
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.6'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
