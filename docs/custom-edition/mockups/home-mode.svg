<g fill="#E5E8EE" font-size="20" font-family="Inter,Arial,sans-serif" text-anchor="middle">
<text x="535" y="914">YouTube</text><text x="814" y="917">Stremio</text><text x="1100" y="914">Play Store</text><text x="1375" y="914">All Apps</text>
</g>
<text x="961" y="1041" fill="#797F89" font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle" letter-spacing="3">↓  ALL APPS</text>
<text x="1828" y="1037" fill="#65707F" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="end" letter-spacing="1.5">HOME DESIGN MOCKUP · NOT AN APK</text>
</svg>