<rect x="1692" y="79" width="148" height="71" rx="35" fill="#2A2E35" fill-opacity=".72" stroke="#50555D" stroke-opacity=".4"/>
<text x="1715" y="124" fill="#E5E8ED">Settings</text>
</g>
<text x="405" y="625" fill="#B4A0E2" font-family="Inter,Arial,sans-serif" font-size="19" letter-spacing="5">SELECTED APP</text>
<text x="396" y="707" fill="#FAF9FF" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="300" letter-spacing="-2">Stremio</text>
<rect x="366" y="765" width="1188" height="207" rx="49" fill="url(#dock)" stroke="#777E89" stroke-opacity=".22" stroke-width="2"/>
<rect x="415" y="795" width="240" height="143" rx="29" fill="url(#tile)"/>
<rect x="690" y="777" width="265" height="165" rx="37" fill="#9A9AE0" fill-opacity=".23" filter="url(#shadow)"/>
<rect x="681" y="778" width="264" height="168" rx="38" fill="url(#focus)" stroke="#D4DFF8" stroke-width="4"/>
<rect x="687" y="784" width="252" height="156" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity=".20" stroke-width="2"/>
<rect x="981" y="795" width="240" height="143" rx="29" fill="url(#tile)"/>
<rect x="1256" y="795" width="240" height="143" rx="29" fill="url(#tile)"/>
