<circle cx="814" cy="853" r="37" fill="#9B80F1"/><path d="M797 827 L840 853 L797 879 Z" fill="#F3EEFF"/>
<path d="M1075 823 L1125 854 L1075 886 Z" fill="#56A8F5"/><path d="M1075 823 L1100 854 L1075 886 Z" fill="#54D19D"/><path d="M1100 854 L1125 854 L1075 886 Z" fill="#F2B45A"/>
