<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Clean dark Home Mode design mockup with clock, four-app dock, and a single focus glass highlight">
<defs>
<radialGradient id="bg" cx="49%" cy="80%" r="66%"><stop stop-color="#151922"/><stop offset=".48" stop-color="#0A0C11"/><stop offset="1" stop-color="#06080B"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#8463C7" stop-opacity=".28"/><stop offset=".5" stop-color="#504C7F" stop-opacity=".09"/><stop offset="1" stop-color="#15151B" stop-opacity="0"/></radialGradient>
<linearGradient id="dock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#353941" stop-opacity=".62"/><stop offset="1" stop-color="#1C2028" stop-opacity=".83"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#424650" stop-opacity=".45"/><stop offset="1" stop-color="#242932" stop-opacity=".4"/></linearGradient>
<linearGradient id="focus" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#717987" stop-opacity=".58"/><stop offset="1" stop-color="#444956" stop-opacity=".46"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="21"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<ellipse cx="950" cy="760" rx="600" ry="265" fill="url(#glow)"/>
<text x="110" y="100" fill="#A1A6AF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500" letter-spacing="5">GOOD EVENING</text>
<text x="106" y="211" fill="#F7F8FA" font-family="Inter,Arial,sans-serif" font-size="114" font-weight="200" letter-spacing="-5">20:37</text>
<text x="112" y="253" fill="#9A9FA9" font-family="Inter,Arial,sans-serif" font-size="23" letter-spacing="2.7">THURSDAY  ·  22 OCTOBER</text>
<g font-family="Inter,Arial,sans-serif" font-size="23" font-weight="500">
<rect x="1338" y="79" width="155" height="71" rx="35" fill="#2A2E35" fill-opacity=".72" stroke="#50555D" stroke-opacity=".4"/>
<text x="1374" y="124" fill="#E5E8ED">Inputs</text>
<rect x="1508" y="79" width="169" height="71" rx="35" fill="#2A2E35" fill-opacity=".72" stroke="#50555D" stroke-opacity=".4"/>
