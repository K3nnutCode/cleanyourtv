<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="CleanYourTV-inspired Home Mode with four wide TV app banners in a continuous rounded bottom dock and one floating glass focus highlight">
<defs>
  <radialGradient id="background" cx="48%" cy="84%" r="84%"><stop stop-color="#10111C"/><stop offset=".42" stop-color="#08090E"/><stop offset="1" stop-color="#050506"/></radialGradient>
  <radialGradient id="ambient" cx="36%" cy="55%" r="57%"><stop stop-color="#513CA0" stop-opacity=".35"/><stop offset=".42" stop-color="#392A65" stop-opacity=".13"/><stop offset="1" stop-color="#0A0A13" stop-opacity="0"/></radialGradient>
  <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242429"/><stop offset="1" stop-color="#141419"/></linearGradient>
  <linearGradient id="focusGlass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FEFFFF" stop-opacity=".55"/><stop offset=".52" stop-color="#ACB4C7" stop-opacity=".17"/><stop offset="1" stop-color="#DFE4FF" stop-opacity=".24"/></linearGradient>
  <linearGradient id="stremio" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26205E"/><stop offset=".5" stop-color="#4837AB"/><stop offset="1" stop-color="#171440"/></linearGradient>
  <linearGradient id="play" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6BB8FF"/><stop offset="1" stop-color="#2A79C7"/></linearGradient>
  <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="tileDrop" x="-15%" y="-25%" width="130%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".63"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#background)"/>
<ellipse cx="744" cy="662" rx="765" ry="470" fill="url(#ambient)"/>
<!-- CleanYourTV header, not another widget dashboard -->
<text x="116" y="94" fill="#9EA1A8" font-family="Outfit,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="5">GOOD EVENING</text>
<text x="107" y="202" fill="#FAF9FC" font-family="Outfit,Arial,sans-serif" font-size="106" font-weight="200" letter-spacing="-5">20:37</text>
<line x1="435" x2="435" y1="136" y2="208" stroke="#8B8B95" stroke-opacity=".3" stroke-width="2"/>
<text x="471" y="179" fill="#B6B7BE" font-family="Outfit,Arial,sans-serif" font-size="26" letter-spacing="3">THURSDAY  22 OCTOBER</text>
<g font-family="Outfit,Arial,sans-serif" font-size="26" font-weight="500">
<rect x="1112" y="91" width="208" height="79" rx="39" fill="#2A2B31" fill-opacity=".73" stroke="#777680" stroke-opacity=".5"/><text x="1159" y="141" fill="#F7F6F9">Inputs</text>
<rect x="1334" y="91" width="236" height="79" rx="39" fill="#2A2B31" fill-opacity=".73" stroke="#777680" stroke-opacity=".5"/><text x="1388" y="141" fill="#F7F6F9">Network</text>
<rect x="1584" y="91" width="219" height="79" rx="39" fill="#2A2B31" fill-opacity=".73" stroke="#777680" stroke-opacity=".5"/><text x="1633" y="141" fill="#F7F6F9">Settings</text>
</g>
<!-- In the original launcher, the focused app has a large title ABOVE the dock -->
<text x="130" y="627" fill="#F8F8FA" font-family="Outfit,Arial,sans-serif" font-size="85" font-weight="300" letter-spacing="-1">Stremio</text>
<!-- one continuous lightly rounded dock, not a collection of square glass icon buttons -->
<rect x="116" y="696" width="1687" height="260" rx="53" fill="url(#dock)" stroke="#76717C" stroke-opacity=".35" stroke-width="2"/>
<!-- Wide app TV banners, illustrative; production uses package banners -->
<rect x="144" y="726" width="359" height="199" rx="31" fill="#F9F9F9"/>
<rect x="566" y="726" width="359" height="199" rx="31" fill="url(#stremio)" filter="url(#tileDrop)"/>
<rect x="987" y="726" width="359" height="199" rx="31" fill="#FAFAFA"/>
<rect x="1415" y="726" width="359" height="199" rx="31" fill="#15151A"/>
<!-- TV banner artwork placeholders -->
<rect x="206" y="790" width="71" height="59" rx="16" fill="#E33128"/>
<path d="M236 802 L264 820 L236 838 Z" fill="#FFFFFF"/>
<text x="293" y="839" fill="#141418" font-size="48" font-family="Outfit,Arial,sans-serif" font-weight="700" letter-spacing="-1">YouTube</text>
<path d="M687 777 L766 823 L687 871 Z" fill="#B8A2FF" opacity=".9"/>
<path d="M706 795 L750 824 L706 852 Z" fill="#E7E2FF"/>
<text x="781" y="838" fill="#FFFFFF" font-size="44" font-family="Outfit,Arial,sans-serif" font-weight="600">Stremio</text>
<path d="M1030 777 L1128 825 L1030 877 Z" fill="url(#play)"/>
<path d="M1030 777 L1079 826 L1030 877 Z" fill="#4CBC72"/>
<path d="M1079 826 L1128 825 L1030 877 Z" fill="#F3C156"/>
<text x="1140" y="819" fill="#33353A" font-size="38" font-family="Outfit,Arial,sans-serif" font-weight="500">Google</text>
<text x="1140" y="860" fill="#33353A" font-size="38" font-family="Outfit,Arial,sans-serif" font-weight="500">Play</text>
<text x="1594" y="845" fill="#DF272B" font-size="53" text-anchor="middle" font-family="Outfit,Arial,sans-serif" font-weight="700" letter-spacing="-3">NETFLIX</text>
<!-- only ONE moving focus frame, shown over Stremio as in original CleanYourTV -->
<rect x="554" y="714" width="383" height="224" rx="42" fill="none" stroke="#BBC2D7" stroke-opacity=".6" stroke-width="21" filter="url(#halo)"/>
<rect x="558" y="716" width="375" height="219" rx="39" fill="none" stroke="#13131A" stroke-opacity=".87" stroke-width="14"/>
<rect x="562" y="722" width="367" height="207" rx="36" fill="none" stroke="url(#focusGlass)" stroke-width="5"/>
<rect x="566" y="726" width="359" height="199" rx="32" fill="none" stroke="#ECEFFB" stroke-opacity=".82" stroke-width="2"/>
<!-- The upstream app library is revealed below the dock with Down, not a fifth dock slot -->
<rect x="144" y="1031" width="359" height="182" rx="29" fill="#303442" opacity=".52"/>
<rect x="566" y="1031" width="359" height="182" rx="29" fill="#2C3240" opacity=".52"/>
<rect x="987" y="1031" width="359" height="182" rx="29" fill="#35323A" opacity=".52"/>
<rect x="1415" y="1031" width="359" height="182" rx="29" fill="#29343D" opacity=".52"/>
<text x="1802" y="1031" fill="#9CA0AB" font-family="Outfit,Arial,sans-serif" font-size="16" letter-spacing="2.5" text-anchor="end">↓  MORE APPS</text>
</svg>