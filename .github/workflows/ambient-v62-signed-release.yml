name: Concept B v6.2 Signed Release (owner opt-in)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private signing key
        env:
          RELEASE_B64: ${{ secrets.TV_RELEASE_KEYSTORE_BASE64 }}
          TV_RELEASE_STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in RELEASE_B64 TV_RELEASE_STORE_PASSWORD TV_RELEASE_KEY_ALIAS TV_RELEASE_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then echo "Missing owner-managed signing secret: $key"; exit 1; fi
          done
          umask 077
          printf '%s' "$RELEASE_B64" | base64 --decode > "$RUNNER_TEMP/tv-release.jks"
          test -s "$RUNNER_TEMP/tv-release.jks"
      - name: Build signed and versioned APK
        working-directory: launcher
        env:
          TV_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/tv-release.jks
          TV_RELEASE_STORE_PASSWORD: ${{ secrets.TV_RELEASE_STORE_PASSWORD }}
          TV_RELEASE_KEY_ALIAS: ${{ secrets.TV_RELEASE_KEY_ALIAS }}
          TV_RELEASE_KEY_PASSWORD: ${{ secrets.TV_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PambientPreview=true \
            -PambientDreamPreview=true \
            -PlauncherApplicationId=com.k3nnut.tvhome.ambient.release \
            -PlauncherVersionCode=620 \
            -PlauncherVersionName=6.2.0
      - name: Audit signed release
        run: |
          set -euo pipefail
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep "package: name='com.k3nnut.tvhome.ambient.release'"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature-report.txt"
          grep -q 'Verified using v2 scheme' "$RUNNER_TEMP/signature-report.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/signature-report.txt"; then
            echo 'Refusing to release debug-signed APK'; exit 1
          fi
          echo 'PASS: independently signed Concept B v6.2 package (owner key)'
      - name: Publish signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: concept-b-v62-owner-signed-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Destroy ephemeral signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/tv-release.jks"
