name: Ambient Concept B v5 Native Dream Test APK

on:
  push:
    branches:
      - feature/custom-home-ambient
    paths:
      - .github/workflows/ambient-concept-b-v5.yml
      - launcher/app/src/main/java/com/gathin/tvhome/Ambient**
      - launcher/app/src/test/java/com/gathin/tvhome/Ambient**
      - launcher/app/build.gradle
      - launcher/app/src/ambientPreview/AndroidManifest.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v5:
    name: Verify independent v5 native DreamService build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and separate v5 DreamService APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PambientPreview=true \
            -PambientDreamPreview=true \
            -PlauncherApplicationId=com.k3nnut.tvhome.ambient.preview.v5
      - name: Check native screensaver manifest and protect Google TV HOME
        run: |
          set -e
          APK=launcher/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.k3nnut.tvhome.ambient.preview.v5'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/v5-manifest.txt"
          python3 - "$RUNNER_TEMP/v5-manifest.txt" <<'PY'
          import re,sys
          xml=open(sys.argv[1],encoding="utf8").read()
          def component(name):
              portions=xml.split("com.gathin.tvhome."+name,1)
              if len(portions)<2: raise SystemExit("Missing component: "+name)
              return portions[1][:1550]
          if not re.search(r"android:enabled.*(?:0x0|false)",component("MainActivity")):
              raise SystemExit("Unsafe: MainActivity must remain disabled")
          if not re.search(r"android:enabled.*(?:0xffffffff|0x1|true)",component("AmbientPhotoActivity")):
              raise SystemExit("Missing enabled standalone photo management activity")
          dream=component("AmbientPhotoDream")
          if not re.search(r"android:enabled.*(?:0xffffffff|0x1|true)",dream):
              raise SystemExit("Native DreamService is not enabled")
          if not re.search(r"android:exported.*(?:0xffffffff|0x1|true)",dream):
              raise SystemExit("Native DreamService not exported to Android dream manager")
          if "android.permission.BIND_DREAM_SERVICE" not in dream:
              raise SystemExit("DreamService missing protected binding permission")
          if "android.service.dreams.DreamService" not in dream:
              raise SystemExit("Native dream service action missing")
          if not re.search(r"android:enabled.*(?:0x0|false)",component("ClockDream")):
              raise SystemExit("Upstream ClockDream must remain disabled")
          print("PASS: v5 protected opt-in photo DreamService, separate from HOME")
          PY
      - name: Upload side-by-side test APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-concept-b-v5-native-dream-test-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 21
